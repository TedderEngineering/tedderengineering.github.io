<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#7E2F1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thanksgiving">
<title>Thanksgiving 2026</title>
<link rel="manifest" href="/2026-thanksgiving/manifest.webmanifest">
<link rel="apple-touch-icon" href="/2026-thanksgiving/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/2026-thanksgiving/icon-192.png">
<style>
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#7E2F1D 0%,#5E2214 100%);color:#2A1C13;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.box{width:100%;max-width:380px;background:#FBF6EE;border-radius:22px;padding:28px 22px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.box img{width:72px;height:72px;border-radius:18px}
h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:28px;margin:12px 0 4px;font-weight:600}
p{margin:0 0 18px;color:#7A6656;font-size:15px}
.pwwrap{position:relative}
.pw{width:100%;font-size:17px;padding:14px 70px 14px 14px;border-radius:12px;border:1.5px solid #E2D3C0;background:#fff;outline:none;font-family:inherit;color:#2A1C13;-webkit-text-fill-color:#2A1C13;caret-color:#7E2F1D;opacity:1}
.pw::placeholder{color:#A8988A;-webkit-text-fill-color:#A8988A}
.pw:focus{border-color:#C96A1B;box-shadow:0 0 0 3px rgba(201,106,27,.15)}
.pwshow{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:8px 10px;background:transparent;color:#7E2F1D;font-size:14px;font-weight:700;border:0;border-radius:8px;cursor:pointer}
label{display:flex;align-items:center;gap:8px;justify-content:center;margin:12px 0 4px;font-size:14px;color:#5B4637}
label input{width:18px;height:18px;accent-color:#7E2F1D}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#7E2F1D;color:#fff;font-size:16px;font-weight:650;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#9C3B24;font-weight:600;font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<div class="box" id="f">
  <img src="/2026-thanksgiving/icon-192.png" alt="">
  <h1>Thanksgiving 2026</h1>
  <p>Enter the family password to open the trip app.</p>
  <div class="pwwrap"><input type="password" id="pw" class="pw" placeholder="Password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Password" autofocus><button type="button" class="pwshow" id="pwshow" aria-label="Show password">Show</button></div>
  <label><input type="checkbox" id="rem" checked> Remember on this phone</label>
  <button id="go" type="button">Open</button>
  <div class="err" id="err" role="alert"></div>
</div>

const KEY = "tg26:key";
const u8 = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const b64 = bytes => { let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const subtle = (window.crypto && crypto.subtle) ? crypto.subtle : null;
const norm = pw => pw.trim().toLowerCase();   // forgiving: ignores capitals and stray spaces

async function deriveKey(pw){
  const enc = new TextEncoder().encode(pw);
  if (subtle){
    try {
      const base = await subtle.importKey("raw", enc, "PBKDF2", false, ["deriveBits"]);
      return new Uint8Array(await subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:u8(P.s), iterations:P.n}, base, 256));
    } catch(e){ /* fall through to the backup */ }
  }
  return TGFallback.derive(pw, u8(P.s), P.n);
}
async function decrypt(raw){
  if (subtle){
    try {
      const k = await subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
      return new TextDecoder().decode(await subtle.decrypt({name:"AES-GCM", iv:u8(P.i)}, k, u8(P.c)));
    } catch(e){ /* wrong key, or WebCrypto blocked here: try the backup */ }
  }
  return new TextDecoder().decode(TGFallback.decrypt(raw, u8(P.i), u8(P.c))); // throws if the key is wrong
}
function reveal(html){
  // Replace the whole page (head, styles and body) with the app. This doesn't rely on
  // document.write, which some viewers change so that the lock screen's styles stay behind.
  const doc = new DOMParser().parseFromString(html, "text/html");
  const scripts = [...doc.querySelectorAll("script")];
  scripts.forEach(sc => sc.remove());
  const root = document.importNode(doc.documentElement, true);
  document.replaceChild(root, document.documentElement);
  scripts.forEach(old => {
    const sc = document.createElement("script");
    for (const at of old.attributes) sc.setAttribute(at.name, at.value);
    sc.textContent = old.textContent;
    document.body.appendChild(sc);
  });
}
(async () => {
  const err = document.getElementById("err");
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved){
    try { reveal(await decrypt(u8(saved))); return; }
    catch(e){ try { localStorage.removeItem(KEY); } catch(_){} }
  }
  // No <form>: embedded previews often block form submission, which made the button do nothing.
  let busy = false;
  const attempt = async () => {
    if (busy) return;
    const btn = document.getElementById("go"), pw = norm(document.getElementById("pw").value);
    if (!pw){ err.textContent = "Type the password first."; return; }
    busy = true; btn.disabled = true; btn.textContent = subtle ? "Unlocking…" : "Unlocking… (a few seconds)"; err.textContent = "";
    await new Promise(r => setTimeout(r, 30)); // let the button text paint before the heavy work
    let html, raw;
    try { raw = await deriveKey(pw); html = await decrypt(raw); }
    catch(e){
      busy = false; btn.disabled = false; btn.textContent = "Open";
      err.textContent = "That password didn't work. Try again.";
      document.getElementById("pw").select(); return;
    }
    if (document.getElementById("rem").checked){ try { localStorage.setItem(KEY, b64(raw)); } catch(e){} }
    reveal(html);
  };
  document.getElementById("pwshow").addEventListener("click", () => {
    const f = document.getElementById("pw"), b = document.getElementById("pwshow");
    const show = f.type === "password"; f.type = show ? "text" : "password";
    b.textContent = show ? "Hide" : "Show"; b.setAttribute("aria-label", show ? "Hide password" : "Show password"); f.focus();
  });
  document.getElementById("go").addEventListener("click", attempt);
  document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); attempt(); } });
})().catch(e => { const el = document.getElementById("err"); if (el) el.textContent = "Couldn't start: " + (e && e.message || e); });
}
</script>
